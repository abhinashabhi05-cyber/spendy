const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 :(ex||inc)?`<div class="chips" style="margin-top:12px">${opts.map(c=>`<label class="chip"><input type="radio" name="cat" value="${esc(c[0])}" ${c[0]===cur?'checked':''}><span>${c[1]} ${esc(c[0])}</span></label>`).join('')}</div>${ex?'<input id="nc" placeholder="Or add a new category">':''}`:'';

const A={
 tab(t){tab=t;render()},close(){$('#sh').hidden=true},

   const o={type,amt:a,cat,date:val('dt')||today(),note:val('nt')};
   if(id){Object.assign(S.txs.find(x=>x.id===id),o)}else S.txs.push({id:uid(),...o})},id?'Updated':'Saved');A.close();if(!id)ok(type==='income'?'Income added':type==='saving'?'Saved':'Expense added')},
 del(id){mutate(()=>{const t=S.txs.find(x=>x.id===id);if(t&&t.billId){const b=S.bills.find(x=>x.id===t.billId);if(b)b.paid=null}S.txs=S.txs.filter(x=>x.id!==id)},'Deleted');A.close()},

 bill(id){const b=id?S.bills.find(x=>x.id===id):null;sheet(`<h3>${b?'Edit bill':'Add bill'}</h3><input id="bn" placeholder="Name" value="${b?esc(b.name):''}"><input id="ba" inputmode="decimal" placeholder="Amount" value="${b?b.amt:''}"><input id="bd" inputmode="numeric" placeholder="Due day of month (1-31)" value="${b?b.day:''}"><button class="pri" data-a="savebill:${id}">Save</button>${b?`<button class="del" data-a="delbill:${id}">Delete bill</button>`:''}`)},

 savesal(){const a=parseFloat(val('sa'));if(a>=0)mutate(()=>{S.salary=a});A.close()},
 loan(id){const l=id?S.loans.find(x=>x.id===id):null;sheet(`<h3>${l?'Edit':'Add'} lent or borrowed</h3><input id="lw" placeholder="Who?" value="${l?esc(l.who):''}"><input id="la" inputmode="decimal" placeholder="Amount" value="${l?l.amt:''}"><select id="ld"><option value="lent" ${l&&l.dir==='lent'?'selected':''}>I lent (they owe me)</option><option value="borrowed" ${l&&l.dir==='borrowed'?'selected':''}>I borrowed (I owe them)</option></select><button class="pri" data-a="saveloan:${id}">Save</button>${l?`<button class="del" data-a="delloan:${id}">Mark settled</button>`:''}`)},
 saveloan(id){const w=val('lw'),a=parseFloat(val('la')),d=val('ld');if(!w||!(a>0))return;mutate(()=>{if(id)Object.assign(S.loans.find(x=>x.id===id),{who:w,amt:a,dir:d});else S.loans.push({id:uid(),who:w,amt:a,dir:d})},'Saved');A.close()},

 ptx(id){const p=id?S.partner.find(x=>x.id===id):null;sheet(`<h3>${p?'Edit':'Add'} entry</h3><select id="pk">${[['held','She gave me to hold'],['gave','I gave money back'],['owes','She owes me'],['iowe','I owe her']].map(o=>`<option value="${o[0]}" ${p&&p.k===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><input id="pa" inputmode="decimal" placeholder="Amount" value="${p?p.amt:''}"><input id="pn" placeholder="Note (optional)" value="${p?esc(p.note||''):''}"><button class="pri" data-a="saveptx:${id}">Save</button>${p?`<button class="del" data-a="delptx:${id}">Delete</button>`:''}`)},
 saveptx(id){const a=parseFloat(val('pa'));if(!(a>0))return;const o={k:val('pk'),amt:a,note:val('pn')};mutate(()=>{if(id)Object.assign(S.partner.find(x=>x.id===id),o);else S.partner.push({id:uid(),date:today(),...o})},'Saved');A.close()},
 delptx(id){mutate(()=>{S.partner=S.partner.filter(x=>x.id!==id)},'Deleted');A.close()},
 bcheck(){const a=parseFloat(val('bc'));if(isNaN(a))return;const d=a-C().avail;if(Math.abs(d)<.5)return toast('Balance already matches');mutate(()=>S.txs.push({id:uid(),type:'adj',amt:d,cat:'',date:today(),note:'Balance check adjustment'}),'Adjusted by '+f(d))},
 backup(){const s=JSON.stringify(S);try{navigator.clipboard.writeText(s).then(()=>toast('Backup copied'),()=>prompt('Copy your backup',s))}catch(e){prompt('Copy your backup',s)}},
 dm(n){dmo=Math.min(0,dmo+ +n);render()},
 dday(d,v){const e=$('#dr'),n=dmBase();if(e)e.innerHTML='<b style="color:var(--ink)">'+new Date(n.getFullYear(),n.getMonth(),+d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+f(+v)+'</b>'},
 welcome(){sheet(`<h3>Welcome 👋</h3><p class="mut" style="margin:0 0 4px">You will be the admin. Just a few quick things, and you can change them later.</p><input id="wn" placeholder="Your name" maxlength="20" aria-label="Your name"><input id="wb" inputmode="decimal" placeholder="Money in your account now (₹)" aria-label="Current balance"><input id="ws" inputmode="decimal" placeholder="Monthly salary (optional)" aria-label="Monthly salary"><button class="pri" data-a="wstart">Start</button>`)},
 wstart(){const n=val('wn')||'Me',b=parseFloat(val('wb'))||0,sa=parseFloat(val('ws'))||0;curP().name=n;S.open.avail=b;S.salary=sa;fresh=false;savePF();persist();setSess(PF.cur);dirty=true;A.close();render();ok('All set, '+n);setTimeout(()=>A.pin('set'),1500)},
 kd(d){if(kp.buf.length>=4)return;kp.buf+=d;kpDots();if(kp.buf.length===4)setTimeout(kpDone,140)},

 lkback(){picker()},lkcancel(){$('#lk').hidden=true;$('#lk').innerHTML=''},lock(){setSess(null);picker()},

 forgot(id){const p=PF.list.find(x=>x.id===id),adm=id===PF.admin;$('#lk').innerHTML=`<div class="lw"><div class="ua">${ini(p)}</div><h2>Forgot PIN?</h2>${adm?`<p>The admin PIN cannot be recovered. You can erase ${esc(p.name)}’s data and start fresh, or go back.</p><button class="pri" style="background:#e11d48;color:#fff" data-a="reset:${id}">Erase data and reset</button>`:'<p>Ask the admin to reset your PIN. They can do it from Admin on the first screen, and your data stays safe.</p>'}<button class="lk2" data-a="pick:${id}">Back</button></div>`},
 newu(){createForm()},

 adm(){kp={mode:'admin',id:PF.admin,buf:'',msg:''};kpRender()},
 apanel(){A.close();adminPanel()},

 adel(id){const p=PF.list.find(x=>x.id===id);$('#lk').innerHTML=`<div class="lw"><h2>Delete ${esc(p.name)}?</h2><p>This permanently erases all of ${esc(p.name)}’s data on this phone.</p><button class="pri" style="background:#e11d48;color:#fff" data-a="adelc:${id}">Delete user</button><button class="lk2" data-a="apanel">Cancel</button></div>`},
 adelc(id){const p=PF.list.find(x=>x.id===id);if(!p||id===PF.admin)return adminPanel();try{localStorage.removeItem(p.key)}catch(e){}PF.list=PF.list.filter(x=>x.id!==id);if(getSess()===id)setSess(null);if(PF.cur===id)PF.cur=PF.admin;savePF();adminPanel(p.name+' was deleted')},
 reset(id){const p=PF.list.find(x=>x.id===id);try{localStorage.removeItem(p.key)}catch(e){}delete p.pin;enter(id)},
 cbak(){try{const d=JSON.parse(localStorage.getItem('spendy.bak.'+KEY));if(!d||!d.txs)throw 0;S=d;S._ts=Date.now();persist();dirty=true;cm=null;render();schedPush();cloudSheet('Your previous data on this phone is back.')}catch(e){cloudSheet('Nothing to undo.')}},
 restore(){sheet('<h3>Restore from backup</h3><p class="mut" style="margin:0">Paste the text you copied with Copy backup. It replaces this user\u2019s data on this phone.</p><textarea id="rb" rows="5" placeholder="Paste backup here" aria-label="Backup text"></textarea><button class="pri" data-a="restorego">Restore</button><button class="del" style="color:var(--ink)" data-a="close">Cancel</button>')},
 restorego(){try{const d=JSON.parse(val('rb'));if(!Array.isArray(d.txs)||!d.open)throw 0;keepBak();S=d;S._ts=Date.now();persist();dirty=true;cm=null;A.close();render();schedPush();ok('Backup restored')}catch(e){const m=$('#rb');if(m){m.value='';m.placeholder='That does not look like a Spendy backup.'}}},
 cloud(){cloudSheet()},
 csave(){const u=val('cu'),k=val('ck');if(!/^https:\/\//.test(u)||k.length<20)return cloudSheet('Enter the full https:// project URL and the anon key.');try{localStorage.setItem('spendy.cfg',JSON.stringify({u,k}))}catch(e){}cloudSheet('Saved. Now sign in or create your account.')},
 cin(){cLogin(0)},cup(){cLogin(1)},
 async csync(){cloudSheet('Syncing…');try{await syncOpen();cloudSheet('Synced.')}catch(x){cloudSheet(cErr(x))}},
 async crest(){cloudSheet('Restoring…');try{if(!curP().cid)return cloudSheet('This profile has no cloud backup yet.');const row=await pull(curP());if(!row)return cloudSheet('No cloud data found for this account yet.');useRemote(row.data);cloudSheet('Restored from the cloud.')}catch(x){cloudSheet(cErr(x))}},

 cadopt(i){const p=curP(),x=cRows[i];if(!x)return;p.cid=x.profile_id;useRemote(x.data);cDone(p,'Loaded "'+((x.data&&x.data._name)||'backup')+'" into this profile.')},

 wipeq(){sheet(`<h3>Erase ${esc(curP().name)}’s data?</h3><p style="font-size:15px">This clears all entries, bills, savings and Together data for this user. The name and PIN stay.</p><button class="pri" style="background:#e11d48;color:#fff" data-a="wipe">Erase data</button><button class="del" style="color:var(--ink)" data-a="close">Cancel</button>`)},

 prof(){if(ad)return A.adx();const adm=curP().id===PF.admin;sheet(`<h3>Users</h3>${PF.list.map(p=>`<button class="row" data-a="sp:${p.id}"><div class="em">${ini(p)}</div><div class="t"><b>${esc(p.name)}${p.id===PF.admin?' · admin':''}</b><small>${p.id===PF.cur?'Current user':(p.pin?'🔒 Tap to switch':'Tap to switch')}</small></div>${p.id===PF.cur?'<div class="a pos">✓</div>':''}</button>`).join('')}<button class="pri" data-a="newu">＋ Add a new user</button><input id="pnm" placeholder="Rename current user" maxlength="20" aria-label="New name"><button class="del" style="color:var(--blue)" data-a="renp">Save new name</button>${!adm&&PF.list.length>1?'<button class="del" data-a="delp">Delete current user</button>':''}<button class="del" data-a="wipeq">Erase this user's data</button><hr style="border:0;border-top:1px solid var(--line);margin:8px 0">${curP().pin?'<button class="del" style="color:var(--blue)" data-a="pin:chg">Change PIN</button><button class="del" style="color:var(--blue)" data-a="pin:rem">Remove PIN</button>':'<button class="del" style="color:var(--blue)" data-a="pin:set">Set a PIN</button>'}${needPick()?'<button class="del" style="color:var(--ink)" data-a="lock">Log out</button>':''}${adm?'<button class="del" style="color:#b45309" data-a="apanel">🛠 Admin tools</button>':''}`)},
 sp(id){A.close();if(id===PF.cur)return;const p=PF.list.find(x=>x.id===id);if(p.pin){kp={mode:'unlock',id,buf:'',msg:'',from:1};kpRender();return}PF.cur=id;savePF();loadP();render();ok('Hi, '+curP().name)},

{let n=0;for(const q of PF.list)if(q.cloud&&!q.cid){delete q.cloud;n=1}if(n){PF._note=1;savePF()}}
